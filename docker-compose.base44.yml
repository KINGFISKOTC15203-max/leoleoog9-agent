# Base44 sandbox environment for the eve / Next.js agent app.
#
# Runs `next dev` (which also boots the eve agent dev server via `withEve`)
# straight from the bind-mounted source, so edits appear without a rebuild.
# No database or other infrastructure services are required by this app.
name: app

services:
  web:
    image: node:24-bookworm
    working_dir: /workspace
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      # Dependency + build state live in named volumes so the source tree stays clean.
      - node_modules:/workspace/node_modules
      - next_cache:/workspace/.next
      # Note: `next dev` rewrites the tracked next-env.d.ts on every server start
      # (it points at .next/dev/types instead of .next/types). That one-file diff is
      # expected sandbox churn, not an app change.
      - pnpm_home:/pnpm-home
      - pnpm_store:/pnpm-store
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - PNPM_HOME=/pnpm-home
      - PATH=/pnpm-home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        # pnpm is installed into a named volume so it survives container recreation.
        if [ ! -x /pnpm-home/bin/pnpm ]; then
          npm install --global --prefix /pnpm-home pnpm@10 >/dev/null
        fi
        pnpm install --frozen-lockfile --store-dir /pnpm-store
        exec ./node_modules/.bin/next dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

volumes:
  node_modules:
  next_cache:
  pnpm_home:
  pnpm_store:
